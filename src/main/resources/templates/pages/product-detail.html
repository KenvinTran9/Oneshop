<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${product.name} + ' - OneShop'">Chi tiet san pham - OneShop</title>
</head>
<body>
<div class="container">
    <div class="breadcrumb-nav">
        <a href="/">Trang chu</a>
        <span class="separator">/</span>
        <a href="/products">San pham</a>
        <span class="separator">/</span>
        <span class="current" th:text="${product.name}">Ten san pham</span>
    </div>
</div>
<section class="detail-section py-4 pb-5">
    <div class="container">
        <div class="row g-5 align-items-start">
            <div class="col-lg-6">
                <img class="product-detail-image" th:src="${product.imageUrl}" th:alt="${product.name}">
            </div>
            <div class="col-lg-6">
                <span class="eyebrow" th:text="${product.brand != null ? product.brand.name : 'OneShop'}">OneShop</span>
                <h1 class="mt-3" th:text="${product.name}">Ten san pham</h1>
                <div class="product-rating mt-2 mb-3">
                    <span class="stars" style="font-size:.95rem">&#9733;&#9733;&#9733;&#9733;&#9734;</span>
                    <span class="rating-count">(4.5) &middot; 120 danh gia</span>
                </div>
                <p class="text-muted" th:text="${product.shortDescription}">Mo ta ngan</p>
                <div class="detail-price mt-3" th:text="${#numbers.formatDecimal(product.salePrice != null ? product.salePrice : product.price, 0, 'COMMA', 0, 'POINT')} + ' d'">0 d</div>
                <div class="d-flex gap-2 flex-wrap mt-4">
                    <button class="btn btn-dark rounded-pill px-4 py-2" type="button">
                        <i class="bi bi-bag-plus me-1"></i>
                        Them vao gio
                    </button>
                    <a class="btn btn-outline-dark rounded-pill px-4 py-2" th:href="@{/stores}">
                        <i class="bi bi-shop me-1"></i>
                        Kiem tra cua hang
                    </a>
                </div>
                <hr class="my-4">
                <h2 class="h5">Thong tin san pham</h2>
                <p class="text-muted" th:text="${product.description}">Mo ta san pham</p>
            </div>
        </div>
    </div>
</section>
</body>
</html>
