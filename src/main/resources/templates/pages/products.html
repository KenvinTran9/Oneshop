<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><title>Mua sắm mỹ phẩm - OneShop</title></head>
<body>
<section class="shop-collection-heading">
    <div class="container">
        <div class="shop-collection-heading-inner">
            <div><span class="eyebrow">OneShop Beauty Store</span><h1>Chăm chút vẻ đẹp mỗi ngày.</h1><p>Khám phá mỹ phẩm từ những thương hiệu bạn yêu thích.</p></div>
            <div class="collection-decoration" aria-hidden="true"><span>SKINCARE</span><span>MAKEUP</span><i class="bi bi-flower1"></i></div>
        </div>
        <form class="shop-search" method="get" th:action="@{/products}">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input name="q" type="search" th:value="${searchQuery}" placeholder="Tìm sản phẩm hoặc thương hiệu..." aria-label="Tìm sản phẩm hoặc thương hiệu">
            <input name="category" type="hidden" th:value="${selectedCategory}">
            <input name="sort" type="hidden" th:value="${selectedSort}">
            <button type="submit">Tìm kiếm</button>
        </form>
    </div>
</section>
<section class="shop-collection">
    <div class="container">
        <nav class="shop-category-nav" aria-label="Danh mục sản phẩm">
            <a th:classappend="${selectedCategory == ''} ? 'active'" th:href="@{/products(q=${searchQuery},sort=${selectedSort})}">Tất cả</a>
            <a th:each="category : ${categories}" th:text="${category.name}" th:classappend="${selectedCategory == category.slug} ? 'active'"
               th:href="@{/products(category=${category.slug},q=${searchQuery},sort=${selectedSort})}"></a>
        </nav>
        <div class="shop-results-bar">
            <p><strong th:text="${productPage.totalElements}">100</strong> sản phẩm <span th:if="${searchQuery != ''}">cho “<span th:text="${searchQuery}"></span>”</span></p>
            <form method="get" th:action="@{/products}" class="shop-sort-form">
                <input type="hidden" name="category" th:value="${selectedCategory}">
                <input type="hidden" name="q" th:value="${searchQuery}">
                <label for="catalog-sort">Sắp xếp</label>
                <select id="catalog-sort" name="sort" data-auto-submit>
                    <option value="newest" th:selected="${selectedSort == 'newest'}">Mới nhất</option>
                    <option value="name" th:selected="${selectedSort == 'name'}">Tên A–Z</option>
                    <option value="price-asc" th:selected="${selectedSort == 'price-asc'}">Giá thấp đến cao</option>
                    <option value="price-desc" th:selected="${selectedSort == 'price-desc'}">Giá cao đến thấp</option>
                </select>
                <noscript><button type="submit">Áp dụng</button></noscript>
            </form>
        </div>
        <div class="shop-product-grid">
            <th:block th:each="product : ${productPage.content}"><article th:replace="~{fragments/product-card :: card(${product})}"></article></th:block>
        </div>
        <div class="shop-empty-state" th:if="${productPage.empty}"><i class="bi bi-search"></i><h2>Chưa tìm thấy sản phẩm</h2><p>Thử một tên sản phẩm, thương hiệu hoặc danh mục khác nhé.</p><a class="shop-button primary" href="/products">Xem tất cả sản phẩm</a></div>
        <nav class="shop-pagination" th:if="${productPage.totalPages > 1}" aria-label="Phân trang sản phẩm">
            <a th:if="${!productPage.first}" th:href="@{/products(page=${productPage.number - 1},category=${selectedCategory},q=${searchQuery},sort=${selectedSort})}"><i class="bi bi-arrow-left"></i> Trước</a>
            <span th:text="${'Trang ' + (productPage.number + 1) + ' / ' + productPage.totalPages}"></span>
            <a th:if="${!productPage.last}" th:href="@{/products(page=${productPage.number + 1},category=${selectedCategory},q=${searchQuery},sort=${selectedSort})}">Tiếp theo <i class="bi bi-arrow-right"></i></a>
        </nav>
    </div>
</section>
</body>
</html>
