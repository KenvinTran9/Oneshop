<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><title>Quản lý đơn hàng - Quản trị OneShop</title><link href="/css/orders.css" rel="stylesheet"></head>
<body><div class="orders-admin"><div class="orders-heading"><span class="order-eyebrow">Quản trị OneShop</span><h1>Quản lý đơn hàng</h1><p>Xác nhận đơn mới và cập nhật tiến trình cho khách hàng.</p></div>
    <form class="order-admin-filter" method="get" th:action="@{${orderBase == null ? '/admin/orders' : orderBase}}"><label for="status">Trạng thái</label><select id="status" name="status"><option value="">Tất cả</option><option th:each="state : ${statuses}" th:value="${state}" th:selected="${selectedStatus == state}" th:text="${state.label}"></option></select><button class="order-button" type="submit">Lọc đơn</button></form>
    <div class="order-panel order-table-wrap"><table class="order-table"><thead><tr><th>Mã đơn / ngày đặt</th><th>Khách hàng</th><th>Tổng tiền COD</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="order : ${orderPage.content}"><td><strong th:text="${order.code}"></strong><small th:text="${#temporals.format(order.createdAt,'dd/MM/yyyy HH:mm')}"></small></td><td><strong th:text="${order.customerName}"></strong><small th:text="${order.customerPhone}"></small></td><td th:text="${#numbers.formatDecimal(order.totalAmount,0,'POINT',0,'COMMA') + ' ₫'}"></td><td><span class="order-status" th:attr="data-status=${order.status}" th:text="${order.status.label}"></span></td><td><a th:href="@{${(orderBase == null ? '/admin/orders' : orderBase) + '/' + order.code}}">Xem đơn</a></td></tr><tr th:if="${orderPage.empty}"><td colspan="5">Chưa có đơn hàng phù hợp.</td></tr></tbody></table></div>
    <nav class="order-detail-actions" aria-label="Phân trang đơn hàng" th:if="${orderPage.totalPages > 1}"><a th:if="${!orderPage.first}" th:href="@{${orderBase == null ? '/admin/orders' : orderBase}(page=${orderPage.number - 1},status=${selectedStatus})}">Trước</a><span th:text="${'Trang ' + (orderPage.number + 1) + ' / ' + orderPage.totalPages}"></span><a th:if="${!orderPage.last}" th:href="@{${orderBase == null ? '/admin/orders' : orderBase}(page=${orderPage.number + 1},status=${selectedStatus})}">Tiếp</a></nav>
</div></body></html>
