spring:
  config:
    import: optional:file:.env[.properties]
  thymeleaf:
    cache: false
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/oneshop_mysql?connectionTimeZone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  dev:
    seed-stock: ${APP_DEV_SEED_STOCK:true}
  jwt:
    # Public development-only key. Override JWT_SECRET for shared environments.
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    issuer: ${JWT_ISSUER:oneshop-dev}
    access-token-expiration-millis: ${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:900000}
    refresh-token-expiration-millis: ${JWT_REFRESH_TOKEN_EXPIRATION_MILLIS:604800000}
