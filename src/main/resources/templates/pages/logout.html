<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng xuất - OneShop</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<section class="container py-5" aria-labelledby="logout-title">
    <div class="mx-auto p-4 p-md-5 border" style="max-width:520px;background:#fbf6f7">
        <span class="store-eyebrow">Tài khoản OneShop</span>
        <h1 id="logout-title" class="h2 my-3">Bạn muốn đăng xuất?</h1>
        <p class="text-muted mb-4">Hẹn gặp lại bạn trong lần mua sắm tiếp theo.</p>
        <form th:action="@{/logout}" method="post" class="d-flex flex-wrap gap-3">
            <button class="store-button dark" type="submit">Đăng xuất</button>
            <a class="store-button" th:href="@{/}">Tiếp tục mua sắm</a>
        </form>
    </div>
</section>
</body>
</html>
