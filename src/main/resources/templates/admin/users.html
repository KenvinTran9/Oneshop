<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><title>Quản lý tài khoản - OneShop</title></head><body>
<div class="admin-page-title"><span class="small text-muted">Khách hàng và nhân sự</span><h2>Quản lý tài khoản</h2><p class="text-muted">Phân công quản lý chi nhánh và kiểm soát trạng thái tài khoản.</p></div>
<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div><div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
<section class="admin-panel"><form th:action="@{/admin/users}" method="get" class="d-flex gap-2 mb-4"><input class="form-control" name="q" th:value="${q}" placeholder="Tìm theo tên hoặc email" aria-label="Tìm tài khoản" maxlength="120"><button class="btn btn-dark">Tìm kiếm</button></form>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Họ tên / Email</th><th>Điện thoại</th><th>Quyền và trạng thái</th></tr></thead><tbody><tr th:each="u : ${userPage.content}"><td><strong th:text="${u.fullName}"></strong><div class="text-muted small" th:text="${u.email}"></div></td><td th:text="${u.phone}"></td><td>
<span th:if="${u.role != null and u.role.name == 'ADMIN'}" class="badge text-bg-dark">Quản trị viên</span>
<form th:unless="${u.role != null and u.role.name == 'ADMIN'}" method="post" th:action="@{/admin/users/{id}(id=${u.id})}" class="d-flex flex-wrap gap-2 align-items-center">
<select class="form-select w-auto" name="role" aria-label="Vai trò"><option value="CUSTOMER" th:selected="${u.role != null and u.role.name == 'CUSTOMER'}">Khách hàng</option><option value="BRANCH_MANAGER" th:selected="${u.role != null and u.role.name == 'BRANCH_MANAGER'}">Quản lý chi nhánh</option></select>
<select class="form-select w-auto" name="storeId" aria-label="Cửa hàng phân công"><option value="">Chọn cửa hàng</option><option th:each="s : ${stores}" th:value="${s.id}" th:selected="${u.store != null and u.store.id == s.id}" th:text="${s.name}"></option></select>
<label><input type="checkbox" name="active" value="true" th:checked="${u.active}"> Hoạt động</label><button class="btn btn-sm btn-outline-dark">Lưu</button></form>
</td></tr><tr th:if="${userPage.empty}"><td colspan="3">Không tìm thấy tài khoản.</td></tr></tbody></table></div><nav class="d-flex gap-3"><a th:if="${userPage.hasPrevious()}" th:href="@{/admin/users(q=${q},page=${userPage.number - 1})}">Trang trước</a><span th:text="${'Trang ' + (userPage.number + 1)}"></span><a th:if="${userPage.hasNext()}" th:href="@{/admin/users(q=${q},page=${userPage.number + 1})}">Trang sau</a></nav></section>
</body></html>
