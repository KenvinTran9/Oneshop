<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hệ thống cửa hàng - OneShop</title>
</head>
<body>
<section class="collection-hero">
    <div class="container">
        <h1>Hệ thống cửa hàng</h1>
        <p>Danh sách các chi nhánh OneShop và thông tin liên hệ trực tiếp.</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row g-4">
            <div class="col-md-6 col-lg-4" th:each="store : ${stores}">
                <article class="store-card store-card-large">
                    <div class="store-icon"><i class="bi bi-shop"></i></div>
                    <h2 class="h5" th:text="${store.name}">Tên cửa hàng</h2>
                    <p th:text="${store.address}">Địa chỉ</p>
                    <div class="small text-muted">
                        <span th:text="${store.district}">Quận/Huyện</span>,
                        <span th:text="${store.city}">Thành phố</span>
                    </div>
                    <a class="btn btn-outline-dark btn-sm rounded-pill mt-3" th:href="'tel:' + ${store.phone}">
                        <i class="bi bi-telephone me-1"></i>
                        <span th:text="${store.phone}">028 0000 0000</span>
                    </a>
                </article>
            </div>
            <div class="col-12" th:if="${#lists.isEmpty(stores)}">
                <div class="empty-state">Chưa có cửa hàng nào được cập nhật.</div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
