<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><title>Chi tiết đơn hàng - OneShop Admin</title><link href="/css/orders.css" rel="stylesheet"></head>
<body><div class="orders-admin"><a class="order-back" href="/admin/orders">← Tất cả đơn hàng</a><div class="orders-heading"><h1 th:text="${order.code}"></h1><span class="order-status" th:attr="data-status=${order.status}" th:text="${order.status.label}"></span></div>
    <div class="order-alert success" role="status" th:if="${orderSuccess}" th:text="${orderSuccess}"></div><div class="order-alert error" role="alert" th:if="${orderError}" th:text="${orderError}"></div>
    <section class="order-panel"><h2>Cập nhật xử lý</h2><form class="order-admin-filter" th:unless="${#lists.isEmpty(order.status.nextStatuses)}" method="post" th:action="@{/admin/orders/{code}/status(code=${order.code})}"><label for="next-status">Chuyển trạng thái</label><select id="next-status" name="status" required><option th:each="state : ${order.status.nextStatuses}" th:value="${state}" th:text="${state.label}"></option></select><button class="order-button" type="submit">Cập nhật đơn</button></form><p class="order-help" th:if="${#lists.isEmpty(order.status.nextStatuses)}">Đơn hàng đã kết thúc xử lý.</p><p class="order-help">Hủy đơn sẽ hoàn lại số lượng vào kho cửa hàng. Không thể hủy đơn đã chuyển sang giao hàng.</p></section>
    <div th:replace="~{fragments/order-content :: content(${order})}"></div>
    <section class="order-panel"><h2>Email xác nhận</h2><p th:text="${order.emailStatusLabel}"></p><p class="order-help" th:if="${order.emailSentAt != null}" th:text="${'SMTP đã tiếp nhận lúc ' + #temporals.format(order.emailSentAt,'dd/MM/yyyy HH:mm')}"></p><form th:if="${order.emailStatus != 'SENT' && order.status.name() != 'CANCELLED'}" th:action="@{/admin/orders/{code}/email(code=${order.code})}" method="post"><button class="order-button secondary" type="submit">Gửi lại email xác nhận</button></form></section>
</div></body></html>
