spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/password-reset-mysql.sql
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      data-source-properties:
        sslMode: VERIFY_IDENTITY
        trustCertificateKeyStoreUrl: ${MYSQL_TRUSTSTORE_URL:file:/tmp/aiven-truststore.p12}
        trustCertificateKeyStoreType: PKCS12
        trustCertificateKeyStorePassword: changeit
  jpa:
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: true
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

server:
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: text/html,text/plain,text/css,application/javascript,text/javascript,application/json,image/svg+xml
  forward-headers-strategy: native
  # Render terminates HTTPS at its proxy. Do not trust arbitrary X-Forwarded-For for throttling.
  tomcat:
    remoteip:
      remote-ip-header: ""
      protocol-header: X-Forwarded-Proto
      internal-proxies: '.*'
  servlet:
    session:
      cookie:
        secure: true

app:
  mail:
    provider: ${MAIL_PROVIDER:resend}
