<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><title>Đơn hàng của tôi - OneShop</title><link href="/css/orders.css" rel="stylesheet"></head>
<body><section class="orders-page"><div class="container">
    <a class="order-back" href="/products"><i class="bi bi-arrow-left" aria-hidden="true"></i> Tiếp tục mua sắm</a>
    <div class="orders-heading"><span class="order-eyebrow">OneShop cùng bạn</span><h1>Đơn hàng <em>của tôi.</em></h1><p>Xem lại những lựa chọn yêu thích và theo dõi hành trình đến tay bạn.</p></div>
    <div class="order-panel order-empty" th:if="${orderPage.empty}"><i class="bi bi-box-seam" aria-hidden="true"></i><h2>Bạn chưa có đơn hàng nào</h2><p>Đơn hàng sẽ xuất hiện ở đây sau khi bạn hoàn tất đặt hàng.</p><a href="/products" class="order-button">Khám phá sản phẩm</a></div>
    <article class="order-history-card" th:each="order : ${orderPage.content}">
        <div class="order-card-top"><div><a th:href="@{/orders/{code}(code=${order.code})}" th:text="${order.code}"></a><small th:text="${#temporals.format(order.createdAt,'dd/MM/yyyy · HH:mm')}"></small></div><span class="order-status" th:attr="data-status=${order.status}" th:text="${order.status.label}"></span></div>
        <div class="order-card-products"><div class="order-mini-item" th:each="item, iter : ${order.items}" th:if="${iter.index < 2}"><img th:src="${item.imageUrl ?: '/images/product-placeholder.svg'}" th:alt="${item.name}" width="60" height="70" loading="lazy"><div><strong th:text="${item.name}"></strong><small th:text="${item.size + (item.shade.isEmpty() ? '' : ' · ' + item.shade) + ' · SL ' + item.quantity}"></small></div></div><small th:if="${#lists.size(order.items) > 2}" th:text="${'Và ' + (#lists.size(order.items) - 2) + ' lựa chọn khác'}"></small></div>
        <div class="order-card-bottom"><div><small>Tổng tiền · COD</small><strong th:text="${#numbers.formatDecimal(order.totalAmount,0,'POINT',0,'COMMA') + ' ₫'}"></strong></div><a class="order-button secondary" th:href="@{/orders/{code}(code=${order.code})}">Theo dõi đơn <i class="bi bi-arrow-up-right" aria-hidden="true"></i></a></div>
    </article>
    <nav class="shop-pagination" aria-label="Phân trang đơn hàng" th:if="${orderPage.totalPages > 1}"><a th:if="${!orderPage.first}" th:href="@{/orders(page=${orderPage.number - 1})}">Trước</a><span th:text="${'Trang ' + (orderPage.number + 1) + ' / ' + orderPage.totalPages}"></span><a th:if="${!orderPage.last}" th:href="@{/orders(page=${orderPage.number + 1})}">Tiếp</a></nav>
</div></section></body></html>
