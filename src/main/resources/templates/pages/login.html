<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập - OneShop</title>
</head>
<body>
<section class="auth-section py-5">
    <div class="container">
        <div class="auth-card mx-auto">
            <div class="text-center mb-4">
                <span class="eyebrow">Tài khoản</span>
                <h1 class="h3 fw-bold mt-2">Đăng nhập</h1>
                <p class="text-muted small mb-0">Chào mừng bạn quay trở lại với OneShop</p>
            </div>
            <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 small rounded-3" th:if="${param.error}">
                <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
                <span>Email hoặc mật khẩu không chính xác. Vui lòng thử lại.</span>
            </div>
            <div class="alert alert-success d-flex align-items-center gap-2 py-2 px-3 small rounded-3" th:if="${param.logout}">
                <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                <span>Bạn đã đăng xuất thành công.</span>
            </div>
            <form th:action="@{/login}" method="post" class="d-grid gap-3">
                <div>
                    <label class="form-label small fw-medium" for="username">Địa chỉ Email</label>
                    <input class="form-control" id="username" name="username" type="email" placeholder="example@email.com" required autocomplete="username">
                </div>
                <div>
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label small fw-medium mb-0" for="password">Mật khẩu</label>
                    </div>
                    <input class="form-control" id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button class="btn btn-dark rounded-pill py-2 mt-2 fw-medium" type="submit">
                    Đăng nhập
                </button>
            </form>
            <p class="small text-muted mt-4 mb-0 text-center">
                Chưa có tài khoản? <a class="fw-semibold text-decoration-underline" th:href="@{/register}">Đăng ký ngay</a>
            </p>
        </div>
    </div>
</section>
</body>
</html>
