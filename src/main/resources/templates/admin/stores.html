<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><title>Quản lý cửa hàng - OneShop</title></head><body>
<div class="admin-page-title d-flex justify-content-between"><div><span class="small text-muted">Mạng lưới OneShop</span><h2>Quản lý cửa hàng</h2></div><a class="btn btn-dark align-self-center" th:href="@{/admin/stores/new}">Thêm cửa hàng</a></div>
<div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
<section class="admin-panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Mã</th><th>Cửa hàng</th><th>Địa chỉ</th><th>Điện thoại</th><th>Trạng thái</th><th></th></tr></thead><tbody><tr th:each="s : ${stores}"><td th:text="${s.code}"></td><td th:text="${s.name}"></td><td th:text="${s.address}"></td><td th:text="${s.phone}"></td><td th:text="${s.active ? 'Đang hoạt động' : 'Ngừng hoạt động'}"></td><td><a class="btn btn-sm btn-outline-dark" th:href="@{/admin/stores/{id}/edit(id=${s.id})}">Chỉnh sửa</a> <a class="btn btn-sm btn-outline-dark" th:href="@{/admin/inventory(storeId=${s.id})}">Xem kho</a></td></tr></tbody></table></div><p class="text-muted small mb-0">Ngừng hoạt động sẽ ẩn cửa hàng khỏi danh sách mua sắm và không phân bổ đơn mới. Dữ liệu đơn cũ được giữ lại.</p></section>
</body></html>
