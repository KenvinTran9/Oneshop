<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><title>Thông tin cửa hàng - OneShop</title></head><body>
<div class="admin-page-title"><h2 th:text="${storeId == null ? 'Thêm cửa hàng' : 'Chỉnh sửa cửa hàng'}"></h2></div>
<section class="admin-panel"><form method="post" th:action="${storeId == null ? '/admin/stores' : '/admin/stores/' + storeId}" th:object="${storeForm}">
<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div><input type="hidden" th:field="*{version}">
<div class="row g-3"><div class="col-md-4"><label for="code" class="form-label">Mã cửa hàng</label><input class="form-control" id="code" th:field="*{code}" required maxlength="30" pattern="[A-Za-z0-9_-]+"></div>
<div class="col-md-8"><label for="name" class="form-label">Tên cửa hàng</label><input class="form-control" id="name" th:field="*{name}" required maxlength="150"></div>
<div class="col-12"><label for="address" class="form-label">Địa chỉ</label><input class="form-control" id="address" th:field="*{address}" required maxlength="255"></div>
<div class="col-md-4"><label for="district" class="form-label">Quận / huyện</label><input class="form-control" id="district" th:field="*{district}" maxlength="80"></div>
<div class="col-md-4"><label for="city" class="form-label">Tỉnh / thành phố</label><input class="form-control" id="city" th:field="*{city}" maxlength="80"></div>
<div class="col-md-4"><label for="phone" class="form-label">Điện thoại</label><input class="form-control" id="phone" th:field="*{phone}" maxlength="20"></div>
<div class="col-12"><label class="form-check"><input class="form-check-input" type="checkbox" th:field="*{active}"> Đang hoạt động</label></div></div>
<div class="d-flex gap-2 mt-4"><button class="btn btn-dark">Lưu cửa hàng</button><a class="btn btn-outline-secondary" th:href="@{/admin/stores}">Quay lại</a></div></form></section>
</body></html>
