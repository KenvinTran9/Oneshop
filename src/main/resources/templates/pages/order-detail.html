<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><title>Theo dõi đơn hàng - OneShop</title><link href="/css/orders.css" rel="stylesheet"></head>
<body><section class="orders-page"><div class="container">
    <a class="order-back" href="/orders"><i class="bi bi-arrow-left" aria-hidden="true"></i> Đơn hàng của tôi</a>
    <div class="order-alert success" th:if="${orderSuccess}" th:text="${orderSuccess}" role="status"></div><div class="order-alert error" th:if="${orderError}" th:text="${orderError}" role="alert"></div>
    <div class="orders-heading"><span class="order-eyebrow">Hành trình yêu chiều</span><h1>Theo dõi <em>đơn hàng.</em></h1><div class="order-title-meta"><strong th:text="${order.code}"></strong><span class="order-status" th:attr="data-status=${order.status}" th:text="${order.status.label}"></span></div><p th:text="${'Đặt ngày ' + #temporals.format(order.createdAt,'dd/MM/yyyy · HH:mm')}"></p></div>
    <div th:replace="~{fragments/order-content :: content(${order})}"></div>
    <div class="order-detail-actions"><a class="order-button secondary" th:href="@{/orders/{code}(code=${order.code})}"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Cập nhật tiến trình</a><form th:if="${order.customerCancellable}" th:action="@{/orders/{code}/cancel(code=${order.code})}" method="post"><button class="order-cancel" type="submit">Hủy đơn hàng</button></form></div>
    <p class="order-help" th:if="${order.customerCancellable}">Bạn có thể tự hủy khi đơn chưa được cửa hàng xác nhận.</p>
</div></section></body></html>
