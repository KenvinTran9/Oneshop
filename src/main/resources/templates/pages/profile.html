<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><title>Tài khoản của bạn - OneShop</title></head><body>
<main class="container py-5"><div class="mb-4"><span class="text-muted">Góc riêng của bạn</span><h1>Tài khoản OneShop</h1><a th:href="@{/orders}">Xem đơn hàng của tôi →</a> · <a href="/account/watches">Sản phẩm theo dõi →</a></div>
<div class="alert alert-success" th:if="${profileSuccess}" th:text="${profileSuccess}"></div><div class="alert alert-danger" th:if="${profileError}" th:text="${profileError}"></div>
<div class="row g-4"><div class="col-lg-6"><section class="border rounded-3 p-4 h-100"><h2 class="h4">Thông tin cá nhân</h2><p class="text-muted" th:text="${profile.email}"></p><form method="post" th:action="@{/account/profile}"><label for="fullName" class="form-label">Họ tên</label><input id="fullName" class="form-control mb-3" name="fullName" th:value="${profile.fullName}" maxlength="120" required><label for="phone" class="form-label">Điện thoại</label><input id="phone" class="form-control mb-3" name="phone" th:value="${profile.phone}" maxlength="20" required><button class="btn btn-dark">Lưu thông tin</button></form></section></div>
<div class="col-lg-6"><section class="border rounded-3 p-4 h-100"><h2 class="h4">Đổi mật khẩu</h2><p class="text-muted">Sau khi đổi, các phiên đăng nhập cũ sẽ hết hiệu lực.</p><form method="post" th:action="@{/account/profile/password}"><label for="currentPassword" class="form-label">Mật khẩu hiện tại</label><input id="currentPassword" name="currentPassword" class="form-control mb-3" type="password" autocomplete="current-password" required><label for="newPassword" class="form-label">Mật khẩu mới</label><input id="newPassword" name="newPassword" class="form-control mb-3" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><label for="confirmation" class="form-label">Nhập lại mật khẩu mới</label><input id="confirmation" name="confirmation" class="form-control mb-3" type="password" autocomplete="new-password" required><button class="btn btn-outline-dark">Đổi mật khẩu</button></form></section></div></div>
<section class="border rounded-3 p-4 mt-4"><h2 class="h4">Sổ địa chỉ giao hàng</h2><div class="row g-3 my-3"><div th:each="a : ${addresses}" class="col-md-6"><article class="border rounded p-3 h-100"><strong th:text="${a.label}"></strong><p class="mb-1" th:text="${a.recipient + ' · ' + a.phone}"></p><p th:text="${a.address}"></p><div class="d-flex gap-3 align-items-center"><a th:href="@{/checkout(addressId=${a.id})}">Dùng khi đặt hàng</a><form method="post" th:action="@{/account/profile/addresses/{id}/delete(id=${a.id})}"><button class="btn btn-sm btn-outline-secondary">Xóa địa chỉ</button></form></div></article></div></div>
<form method="post" th:action="@{/account/profile/addresses}" class="row g-3"><div class="col-md-4"><label for="label" class="form-label">Tên địa chỉ</label><input id="label" name="label" class="form-control" placeholder="Nhà riêng / Công ty" maxlength="60" required></div><div class="col-md-4"><label for="recipient" class="form-label">Người nhận</label><input id="recipient" name="recipient" class="form-control" maxlength="120" required></div><div class="col-md-4"><label for="addressPhone" class="form-label">Điện thoại nhận hàng</label><input id="addressPhone" name="phone" class="form-control" maxlength="20" required></div><div class="col-12"><label for="address" class="form-label">Địa chỉ đầy đủ</label><input id="address" name="address" class="form-control" maxlength="255" required></div><div><button class="btn btn-dark">Thêm địa chỉ</button></div></form></section>
</main></body></html>
